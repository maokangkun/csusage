[package]
name = "csusage"
version = "0.1.0"
edition = "2021"
description = "Token usage reports for Claude Science from its local metadata database"
license = "MIT"
repository = "https://github.com/maokangkun/csusage"
keywords = ["claude", "anthropic", "usage", "tokens", "llm"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite = "0.37"

[profile.release]
lto = true
strip = true
